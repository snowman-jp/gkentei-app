<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G検定｜管理者ダッシュボード</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18263d;background:#f3f6fb}body{margin:0}header{background:#102447;color:#fff;padding:26px 18px}header>div,main{max-width:760px;margin:auto}main{padding:20px 16px}h1{font-size:23px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:18px;background:white;border-radius:16px;box-shadow:0 1px 8px #182b450e}.tile small{color:#50627c}.tile strong{display:block;font-size:31px;margin-top:8px}.panel{background:white;padding:20px;border-radius:16px;margin-bottom:16px}label{display:block;margin-top:10px}input,button{font:inherit;padding:12px;border-radius:10px}input{border:1px solid #aebed2;width:100%;box-sizing:border-box}button{border:0;background:#2454b7;color:white;margin-top:12px;cursor:pointer}a{color:inherit}#status{white-space:pre-wrap;line-height:1.7}#report[hidden]{display:none}</style></head><body><header><div><a href="./index.html">← 学習アプリへ</a><h1>管理者ダッシュボード</h1><p>クラウド同期の利用状況</p></div></header><main><section class="panel" id="login"><h2>管理者ログイン</h2><p>登録済みの管理者アカウントでログインしてください。</p><form id="form"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">ログインして確認</button></form></section><p id="status" role="status" aria-live="polite"></p>
<section id="report" hidden><div class="grid" id="tiles"></div><p id="updated"></p><button id="reload">最新データに更新</button><button id="logout">ログアウト</button><p>7日・30日利用者数は、期間中に新しい解答または完了セットがクラウドへ保存されたユーザー数です。アプリ閲覧者数とは異なります。</p></section></main><script src="./staging-config.js"></script><script>
(()=>{'use strict';const cfg=window.GKENTEI_STAGING_CONFIG||{},base=cfg.url,key=cfg.publishableKey;if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(base||'')||typeof key!=='string'||!key.startsWith('sb_publishable_')||base.includes('kuduxlkmuvongfdqyjoc')){document.getElementById('status').textContent='検証用Supabaseが未設定です。正式版データを保護するため登録・表示を停止しています。';document.getElementById('form')?.querySelector('button')?.setAttribute('disabled','');document.getElementById('signup')?.querySelector('button')?.setAttribute('disabled','');return;}let token=null;const $=id=>document.getElementById(id);async function request(path,opt={}){const res=await fetch(base+path,{...opt,headers:{apikey:key,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})},cache:'no-store'});const json=await res.json().catch(()=>({}));if(!res.ok)throw Error(json.message||json.msg||json.error_description||'アクセスできません');return json;}const items=[['registered','登録アカウント'],['approved','同期許可済み'],['ever_synced','同期利用経験者'],['active_7d','直近7日間'],['active_30d','直近30日間'],['answers','保存済み解答'],['sets','保存済み完了セット']];async function load(){const data=await request('/rest/v1/rpc/admin_sync_overview',{method:'POST',body:'{}'});$('tiles').replaceChildren(...items.map(([field,label])=>{const box=document.createElement('div');box.className='tile';const small=document.createElement('small');small.textContent=label;const strong=document.createElement('strong');strong.textContent=String(data[field]??'—');box.append(small,strong);return box;}));$('updated').textContent='集計日時：'+new Date(data.updated_at).toLocaleString('ja-JP');$('login').hidden=true;$('report').hidden=false;$('status').textContent='';}function clear(){token=null;$('report').hidden=true;$('login').hidden=false;$('password').value='';} $('form').addEventListener('submit',async e=>{e.preventDefault();$('status').textContent='認証中…';try{const data=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=data.access_token;$('password').value='';await load();}catch(err){clear();$('status').textContent='確認できませんでした。管理者権限とログイン情報を確認してください。 '+err.message;}});$('reload').onclick=async()=>{try{await load()}catch(e){$('status').textContent=e.message}};$('logout').onclick=()=>{clear();$('status').textContent='ログアウトしました。'};})();
</script></body></html>
