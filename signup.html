<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G検定｜新規登録</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18263d;background:#f3f6fb}body{margin:0}main{max-width:480px;margin:8vh auto;padding:24px;background:white;border-radius:18px;box-shadow:0 5px 24px #0a255018}label{display:block;margin-top:18px;font-weight:650}input{display:block;width:100%;box-sizing:border-box;padding:14px;margin-top:7px;border:1px solid #aebed2;border-radius:10px;font:inherit}button{margin-top:22px;width:100%;padding:15px;background:#2454b7;color:white;border:0;border-radius:12px;font-weight:700;font:inherit}p{line-height:1.7}small{color:#53647c}a{color:#2454b7}#status{white-space:pre-wrap}</style></head><body><main><a href="./index.html">← 学習アプリへ戻る</a><h1>クラウド同期の新規登録</h1><p>登録後は管理者の個別承認なしで、本人の学習記録を同期できます。通常の問題演習は登録不要です。</p>
<form id="signup"><label for="email">メールアドレス</label><input id="email" type="email" required autocomplete="email"><label for="password">パスワード（12文字以上）</label><input id="password" type="password" minlength="12" required autocomplete="new-password"><label for="confirm">パスワード（確認）</label><input id="confirm" type="password" minlength="12" required autocomplete="new-password"><button type="submit" id="submit">登録する</button></form>
<p id="status" role="status" aria-live="polite"></p><small>確認メールが届く場合は、メール内リンクで確認後、学習アプリの「クラウド同期」からログインしてください。同期は本人が同意しない限り開始されません。パスワードを他人に教えないでください。</small></main>
<script src="./staging-config.js"></script><script>
(()=>{'use strict';const cfg=window.GKENTEI_STAGING_CONFIG||{},base=cfg.url,key=cfg.publishableKey;if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(base||'')||typeof key!=='string'||!key.startsWith('sb_publishable_')){document.getElementById('status').textContent='検証用Supabaseが未設定です。正式版データを保護するため登録・表示を停止しています。';document.getElementById('form')?.querySelector('button')?.setAttribute('disabled','');document.getElementById('signup')?.querySelector('button')?.setAttribute('disabled','');return;}const $=id=>document.getElementById(id);$('signup').addEventListener('submit',async e=>{e.preventDefault();const pass=$('password').value;if(pass!==$('confirm').value){$('status').textContent='確認用パスワードが一致しません。';return;}const button=$('submit');button.disabled=true;$('status').textContent='登録を確認しています…';try{const res=await fetch(base+'/auth/v1/signup?redirect_to='+encodeURIComponent(new URL('./index.html',location.href).href),{method:'POST',headers:{'apikey':key,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:pass})});const data=await res.json();if(!res.ok)throw Error(data.msg||data.error_description||data.message||'登録できませんでした');$('status').textContent='受付が完了しました。メール確認が設定されている場合は、届いた確認メールを開いてください。その後、アプリからログインできます。';$('password').value='';$('confirm').value='';}catch(err){$('status').textContent='登録できませんでした：'+err.message;}finally{button.disabled=false;}});})();
</script></body></html>
