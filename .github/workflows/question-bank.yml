name: Verify G-Kentei 300 question bank
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  question-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 300 original questions and all answer explanations
        run: node tests/question-bank.test.cjs
